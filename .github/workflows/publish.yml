name: Publish

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Use an npm CLI that supports trusted publishing
        run: |
          node --input-type=module <<'EOF'
          import { execSync } from "node:child_process";
          const raw = execSync("npm --version", { encoding: "utf8" }).trim();
          const [major, minor] = raw.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            execSync("npm install --global npm@latest", { stdio: "inherit" });
          }
          EOF

      - name: Check the tag matches package.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tag = process.env.GITHUB_REF_NAME ?? "";
          if (tag !== `v${version}`) {
            console.error(`标签 ${tag} 与 package.json 的 ${version} 不一致，应为 v${version}`);
            process.exit(1);
          }
          EOF

      - run: npm test

      - name: Pack and publish
        run: |
          tarball=$(npm pack)
          npm publish --provenance --access public "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --title "$GITHUB_REF_NAME" \
            --notes "npm 包 volc-ark-mcp ${GITHUB_REF_NAME#v}"
